<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2EA">
<meta name="apple-mobile-web-app-title" content="DAGMAWIT">
<title>DAGMAWIT — Money</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<script>
/* Start-up watchdog. Plain script, independent of the app code, so it still
   works if that code cannot load or run on this phone. If the app has not
   started after 12 seconds, it says so and shows any error it caught. */
(function () {
  var errs = [];
  // capture = true also catches files that fail to download (a missing upload)
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) { errs.push('Could not load ' + String(t.src || t.href).split('/').pop()); return; }
    errs.push((e.message || 'Script error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push(String(r && r.message ? r.message : r)); });
  setTimeout(function () {
    if (window.__appStarted) return;
    var v = document.getElementById('loadingView');
    if (!v || v.style.display === 'none') return;
    var s = document.getElementById('loadSpin'), m = document.getElementById('loadMsg');
    if (s) s.style.display = 'none';
    if (m) m.innerHTML = 'The app is taking too long to start.<small>' + (errs.length ? errs.join(' · ').replace(/[<>&]/g, '') : 'No error was reported. Check the internet connection.') + '</small><button type="button" onclick="location.reload()">Try again</button>';
  }, 12000);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./index-Cwt58ADI.js"></script>
  <link rel="stylesheet" crossorigin href="./index-BXYr8Gtc.css">
</head>
<body>
<div id="loadingView" class="loading"><img src="./logo-white.png" alt="DAGMAWIT"><div class="spin" id="loadSpin"></div><div class="loadmsg" id="loadMsg"></div></div>

<div id="authView" class="auth" style="display:none">
  <form class="card" id="au_form">
    <div class="logo"><img src="./logo-white.png" alt="DAGMAWIT"></div>
    <h1>Welcome back</h1>
    <p>Sign in to your money book.</p>
    <div class="field"><label for="au_email">Email</label><input class="input" id="au_email" type="email" autocomplete="email" placeholder="name@example.com"></div>
    <div class="field"><label for="au_pass">Password</label><input class="input" id="au_pass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="au_btn" type="submit">Sign in</button>
    <div id="au_msg" class="err" style="text-align:center;margin-top:12px"></div>
  </form>
</div>

<div id="appView" style="display:none">
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" data-act="openSide" aria-label="Menu"></button>
    <div class="brand">DAGMAWIT</div>
    <div class="syncdot" id="sync"><i></i></div>
    <button class="iconbtn" id="eyeBtn" data-act="toggleMoney" aria-label="Hide amounts"></button>
  </header>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Main">
    <div class="nav-in">
      <button class="tab on" data-act="tab" data-tab="home"></button>
      <button class="tab" data-act="tab" data-tab="income"></button>
      <button class="add" id="addBtn" data-act="openAdd" aria-label="Add"></button>
      <button class="tab" data-act="tab" data-tab="expenses"></button>
      <button class="tab" data-act="tab" data-tab="reports"></button>
    </div>
  </nav>
  <div class="sidescrim" id="sideScrim" data-act="closeSide"></div>
  <aside class="side" id="side">
    <div class="brand">DAGMAWIT</div>
    <div id="sideItems"></div>
    <div class="foot">Money app · data shared by both phones</div>
  </aside>
</div>

<div class="scrim" id="scrim" data-act="closeSheets"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="./config.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  });
}
</script>
</body>
</html>
